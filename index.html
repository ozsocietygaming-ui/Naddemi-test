/* =========================================================================
   5. FIREBASE REALTIME LISTENERS (يدمج مع القيم الاحتياطية)
   ========================================================================= */
function initFirebaseListeners() {
  db.ref("settings").on("value", snap => {
    const v = snap.val();
    STATE.settings = v ? { ...FALLBACK_SETTINGS, ...v } : {...FALLBACK_SETTINGS};
    render();
  });
  db.ref("products").on("value", snap => {
    const v = snap.val();
    STATE.products = v && Object.keys(v).length ? v : {...FALLBACK_PRODUCTS};
    render();
  });
  db.ref("shipping").on("value", snap => {
    const v = snap.val();
    STATE.shipping = v && Object.keys(v).length ? v : {...FALLBACK_SHIPPING};
    render();
  });
  db.ref("desks").on("value", snap => {
    const v = snap.val();
    STATE.desks = v || {};
    render();
  });
  db.ref("orders").on("value", snap => {
    STATE.orders = snap.val() || {};
    render();
  });
}

function fmtDZD(n) { return (Number(n)||0).toLocaleString("ar-DZ") + " د.ج"; }

function showToast(msg, ok=true) {
  const t = document.getElementById("toast");
  const box = document.getElementById("toastBox");
  box.textContent = msg;
  box.className = "px-5 py-3 rounded-xl shadow-lg font-heading font-bold text-sm " + (ok ? "bg-ink text-cream" : "bg-red-600 text-white");
  t.classList.remove("hidden");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.add("hidden"), 3000);
}

function cartCount() {
  return Object.values(STATE.cart).reduce((a,b)=>a+b, 0);
}
function cartSubtotal() {
  let sum = 0;
  for (const [pid, qty] of Object.entries(STATE.cart)) {
    const p = STATE.products[pid];
    if (p) sum += (Number(p.price)||0) * qty;
  }
  return sum;
}
function currentDeliveryFee() {
  if (!STATE.selectedWilaya) return 0;
  if (STATE.deliveryType === "home") {
    return Number(STATE.shipping[STATE.selectedWilaya]?.home || 0);
  } else {
    // ابحث عن سعر مكتب مطابق للولاية والبلدية المختارة، وإلا استخدم السعر الافتراضي للولاية
    const match = Object.values(STATE.desks).find(d => d.wilayaCode === STATE.selectedWilaya && d.baladia === STATE.selectedBaladia);
    if (match) return Number(match.fee || 0);
    return Number(STATE.shipping[STATE.selectedWilaya]?.desk || 0);
  }
}
function grandTotal() { return cartSubtotal() + currentDeliveryFee(); }

function addToCart(pid) {
  STATE.cart[pid] = (STATE.cart[pid]||0) + 1;
  render();
}
function decFromCart(pid) {
  if (!STATE.cart[pid]) return;
  STATE.cart[pid] -= 1;
  if (STATE.cart[pid] <= 0) delete STATE.cart[pid];
  render();
}
function removeFromCart(pid) {
  delete STATE.cart[pid];
  render();
}

function getDesksForWilaya(code) {
  return Object.entries(STATE.desks).filter(([id,d]) => d.wilayaCode === code);
}

/* =========================================================================
   9. ORDER SUBMISSION
   ========================================================================= */
function validateOrder() {
  const f = STATE.form || {};
  if (cartCount() === 0) return "الرجاء إضافة منتج واحد على الأقل إلى السلة";
  if (!f.firstName) return "الرجاء إدخال الاسم الأول";
  if (!f.lastName) return "الرجاء إدخال اللقب";
  if (!f.instagram) return "الرجاء إدخال اسم المستخدم على إنستغرام";
  if (!f.phone1) return "الرجاء إدخال رقم الهاتف الأول";
  if (!STATE.selectedWilaya) return "الرجاء اختيار الولاية";
  if (!STATE.selectedBaladia) return "الرجاء اختيار البلدية / المكتب";
  return null;
}

function submitOrder() {
  const err = validateOrder();
  if (err) { showToast(err, false); return; }

  STATE.submitting = true; render();

  const items = Object.entries(STATE.cart).map(([pid,qty]) => {
    const p = STATE.products[pid];
    return { name: p?.name || pid, price: p?.price || 0, qty, lineTotal: (p?.price||0)*qty };
  });

  const orderData = {
    customer: { ...STATE.form },
    delivery: {
      type: STATE.deliveryType,
      wilayaCode: STATE.selectedWilaya,
      wilayaName: STATE.wilayas.find(w=>w.code===STATE.selectedWilaya)?.name || "",
      baladia: STATE.selectedBaladia,
      fee: currentDeliveryFee()
    },
    payment: STATE.paymentMethod,
    items,
    subtotal: cartSubtotal(),
    total: grandTotal(),
    status: "قيد الانتظار",
    createdAt: Date.now()
  };

  db.ref("orders").push(orderData)
    .then(() => {
      sendOrderEmail(orderData);
      STATE.cart = {};
      STATE.submitting = false;
      STATE.showSuccess = true;
      render();
    })
    .catch(e => {
      STATE.submitting = false;
      showToast("حدث خطأ أثناء إرسال الطلب، حاول مجدداً", false);
      render();
      console.error(e);
    });
}

function sendOrderEmail(order) {
  if (!window.emailjs || EMAILJS_PUBLIC_KEY === "YOUR_EMAILJS_PUBLIC_KEY") {
    console.warn("EmailJS غير مُهيأ — تم حفظ الطلب في قاعدة البيانات فقط.");
    return;
  }
  const itemsTable = order.items.map(i => `${i.name} × ${i.qty} = ${i.lineTotal} د.ج`).join("\n");
  const params = {
    to_email: STORE_OWNER_EMAIL,
    customer_name: `${order.customer.firstName} ${order.customer.lastName}`,
    instagram: order.customer.instagram,
    phone1: order.customer.phone1,
    phone2: order.customer.phone2 || "-",
    delivery_type: order.delivery.type === "home" ? "توصيل للمنزل" : "توصيل للمكتب",
    wilaya: order.delivery.wilayaName,
    baladia: order.delivery.baladia,
    payment: order.payment === "cod" ? "الدفع عند الاستلام" : "دفع مسبق",
    items: itemsTable,
    delivery_fee: order.delivery.fee,
    total: order.total
  };
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params)
    .catch(e => console.warn("فشل إرسال البريد الإلكتروني:", e));
}

/* =========================================================================

   ========================================================================= */
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(str) { return escapeHtml(str); }

    fee: Number(document.getElementById("df_fee").value)||0
  };
  if (!data.baladia) { showToast("الرجاء إدخال اسم المكتب", false); return; }
  db.ref("desks").push(data).then(()=>{ showToast("تم إضافة المكتب"); closeDeskForm(); });
}
function deleteDesk(id) {
  if (!confirm("حذف هذا المكتب؟")) return;
  db.ref("desks/"+id).remove().then(()=>showToast("تم الحذف"));
}

/* ---- Branding Tab ---- */
function renderAdminBranding() {
  const s = STATE.settings;
  return `
  <div class="bg-white border border-hair rounded-xl p-4 max-w-lg space-y-3">
    <h3 class="font-heading font-bold text-sm mb-2">الهوية والبانير</h3>
    <div>
      <label class="block text-xs font-bold text-ink/70 mb-1">اسم المتجر</label>
      <input id="br_name" value="${escapeAttr(s.storeName)}" class="w-full border border-hair rounded-lg px-3 py-2 text-sm bg-cream">
    </div>
    <div>
      <label class="block text-xs font-bold text-ink/70 mb-1">رابط الشعار (Logo)</label>
      <input id="br_logo" value="${escapeAttr(s.logoUrl)}" class="w-full border border-hair rounded-lg px-3 py-2 text-sm bg-cream">
    </div>
    <div>
      <label class="block text-xs font-bold text-ink/70 mb-1">رابط صورة الغلاف (Banner)</label>
      <input id="br_banner" value="${escapeAttr(s.bannerUrl)}" class="w-full border border-hair rounded-lg px-3 py-2 text-sm bg-cream">
    </div>
    <div>
      <label class="block text-xs font-bold text-ink/70 mb-1">رابط صورة التعليمات (اختياري)</label>
      <input id="br_info" value="${escapeAttr(s.infoGraphicUrl)}" class="w-full border border-hair rounded-lg px-3 py-2 text-sm bg-cream">
    </div>
    <div>
      <label class="block text-xs font-bold text-ink/70 mb-1">كلمة مرور لوحة التحكم</label>
      <input id="br_pass" value="${escapeAttr(s.adminPassword)}" class="w-full border border-hair rounded-lg px-3 py-2 text-sm bg-cream">
    </div>
    <button onclick="saveBranding()" class="px-4 py-2 rounded-lg bg-clay hover:bg-clayDark text-white text-xs font-bold">حفظ التغييرات</button>
  </div>`;
}
function saveBranding() {
  const data = {
    storeName: document.getElementById("br_name").value.trim() || "متجرنا",
    logoUrl: document.getElementById("br_logo").value.trim(),
    bannerUrl: document.getElementById("br_banner").value.trim(),
    infoGraphicUrl: document.getElementById("br_info").value.trim(),
    adminPassword: document.getElementById("br_pass").value.trim() || "admin123"
  };
  db.ref("settings").update(data).then(()=>showToast("تم حفظ الهوية بنجاح"));
}

/* =========================================================================
   13. MASTER RENDER
   ========================================================================= */
function render() {
  const app = document.getElementById("app");
  app.innerHTML = isAdminRoute() ? renderAdmin() : renderStorefront();
}

/* =========================================================================
   14. INIT
   ========================================================================= */
initFirebaseListeners();
render();
</script>
